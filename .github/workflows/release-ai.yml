name: Release Notes (AI)

on:
  push:
    branches: [main]

# Narrow default. Jobs that need more declare it themselves.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Collect controlled input for the model.
  #    The model never sees raw GitHub data: it only sees this report file.
  # ---------------------------------------------------------------------------
  collect-metadata:
    name: Collect PR metadata
    runs-on: ubuntu-latest
    outputs:
      pr_count: ${{ steps.extract.outputs.pr_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect merged pull request metadata
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Bound the untrusted fields before they reach the model.
            const MAX_TITLE_CHARS = 200;
            const MAX_BODY_CHARS = 1200;

            function truncate(str, max) {
              if (!str) return '';
              const s = String(str);
              return s.length > max ? s.slice(0, max) + '...[truncated]' : s;
            }

            // Collapse code fences so PR content cannot reshape the prompt.
            function sanitize(str) {
              if (!str) return '';
              return String(str).replace(/```/g, '`');
            }

            const commits = context.payload.commits ?? [];
            const prsByNumber = new Map();

            for (const commit of commits) {
              const associatedPrs = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: commit.id,
                  per_page: 100,
                }
              );

              for (const pr of associatedPrs) {
                if (!pr.merged_at) continue;
                if (pr.base?.ref !== 'main') continue;

                if (!prsByNumber.has(pr.number)) {
                  prsByNumber.set(pr.number, {
                    number: pr.number,
                    title: truncate(sanitize(pr.title), MAX_TITLE_CHARS),
                    labels: (pr.labels ?? []).map(l => l.name),
                    author: pr.user?.login ?? null,
                    body: truncate(sanitize(pr.body ?? ''), MAX_BODY_CHARS),
                  });
                }
              }
            }

            // Deliberately omits PR URL, timestamps, commits and diffs: they
            // grow the context without improving the release notes.
            const report = {
              generated_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              pull_requests: Array.from(prsByNumber.values()),
            };

            fs.writeFileSync('release-report.json', JSON.stringify(report, null, 2));
            core.info(`Wrote release-report.json with ${report.pull_requests.length} merged PR(s).`);

            core.setOutput('pr_count', String(report.pull_requests.length));

      - name: Upload release input artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-input
          path: release-report.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Call the model. Skipped entirely when there is nothing to summarise,
  #    which avoids both the token cost and the reserved Bedrock quota.
  # ---------------------------------------------------------------------------
  generate-release-notes:
    name: Generate release notes (Bedrock)
    needs: collect-metadata
    if: needs.collect-metadata.outputs.pr_count != '0'
    runs-on: ubuntu-latest
    environment:
      name: Bedrock
    permissions:
      contents: read
      id-token: write # Required to request the OIDC token for AssumeRoleWithWebIdentity.
    outputs:
      stop_reason: ${{ steps.bedrock.outputs.stop_reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release input artifact
        uses: actions/download-artifact@v4
        with:
          name: release-input

      # Exchanges the OIDC token for short-lived credentials. No long-lived
      # AWS key exists anywhere in this repository.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gha-release-notes-${{ github.run_id }}

      - name: Generate release notes via reusable action
        id: bedrock
        uses: ./.github/bedrock-converse
        with:
          model_id: ${{ secrets.BEDROCK_MODEL_ID }}
          region: ${{ secrets.AWS_REGION }}
          system_prompt_file: "ai/prompts/release-notes.prompt.md"
          user_input_file: "release-report.json"
          output_file: "release-notes.md"
          temperature: "0.1"
          max_tokens: ${{ secrets.BEDROCK_MAX_TOKENS || '1500' }}

      - name: AI budget + performance warnings (annotations)
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          # Soft thresholds: warn, never block delivery. Tune per org.
          MAX_TOKENS=2000
          MAX_OUTPUT_TOKENS=1200
          MAX_DURATION=20

          TOKENS="${{ steps.bedrock.outputs.total_tokens }}"
          OUT_TOKENS="${{ steps.bedrock.outputs.completion_tokens }}"
          DURATION="${{ steps.bedrock.outputs.duration_seconds }}"
          STOP_REASON="${{ steps.bedrock.outputs.stop_reason }}"

          echo "Total tokens: ${TOKENS}"
          echo "Output tokens: ${OUT_TOKENS}"
          echo "Duration (s): ${DURATION}"
          echo "Stop reason: ${STOP_REASON}"

          # Missing outputs usually mean action.yml forgot a $GITHUB_OUTPUT line.
          if [[ -z "${TOKENS}" || -z "${DURATION}" || -z "${STOP_REASON}" ]]; then
            echo "::warning::AI telemetry outputs missing; check action.yml outputs."
            exit 0
          fi

          if [[ "${TOKENS}" -gt "${MAX_TOKENS}" ]]; then
            echo "::warning::AI token usage (${TOKENS}) exceeded soft budget (${MAX_TOKENS}). Consider reducing metadata size or tightening truncation."
          fi

          # Claude 3.7+ on Bedrock burns 5 quota tokens per output token, so
          # output volume drives throttling risk more than the total does.
          if [[ "${OUT_TOKENS}" -gt "${MAX_OUTPUT_TOKENS}" ]]; then
            echo "::warning::Output tokens (${OUT_TOKENS}) exceeded soft budget (${MAX_OUTPUT_TOKENS}). Output burns quota at 5x on Claude 3.7+."
          fi

          if [[ "${DURATION}" -gt "${MAX_DURATION}" ]]; then
            echo "::warning::AI call duration (${DURATION}s) exceeded soft threshold (${MAX_DURATION}s). Potential latency regression."
          fi

          if [[ "${STOP_REASON}" != "end_turn" ]]; then
            echo "::warning::Unexpected stopReason '${STOP_REASON}'. 'max_tokens' means the output was truncated; raise BEDROCK_MAX_TOKENS."
          fi

      - name: Publish AI telemetry summary (Job Summary)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## AI Telemetry Summary"
            echo ""
            echo "- Provider: Amazon Bedrock"
            echo "- Model and region: see ai-telemetry.json artifact"
            echo "- Stop reason: ${{ steps.bedrock.outputs.stop_reason }}"
            echo "- Duration (seconds): ${{ steps.bedrock.outputs.duration_seconds }}"
            echo "- Model latency (ms): ${{ steps.bedrock.outputs.latency_ms }}"
            echo "- Total tokens: ${{ steps.bedrock.outputs.total_tokens }}"
            echo "- Prompt tokens: ${{ steps.bedrock.outputs.prompt_tokens }}"
            echo "- Completion tokens: ${{ steps.bedrock.outputs.completion_tokens }}"
            echo ""
            echo "### Notes"
            echo "- If token or duration warnings appear above, tune truncation or thresholds."
            echo "- A stop reason other than 'end_turn' means the response was cut short."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release output artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-output
          path: |
            release-report.json
            release-notes.md
            .bedrock.response.json
            ai-telemetry.json
          if-no-files-found: error

      - name: Upload AI telemetry artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-telemetry
          path: ai-telemetry.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Nothing is published until the output matches the prompt contract.
  #    This job must stay in sync with ai/prompts/release-notes.prompt.md.
  # ---------------------------------------------------------------------------
  validate-release-notes:
    name: Validate deterministic contract
    needs: [collect-metadata, generate-release-notes]
    if: needs.collect-metadata.outputs.pr_count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Download release output artifact
        uses: actions/download-artifact@v4
        with:
          name: release-output

      # A truncated response can still satisfy the heading checks below, so
      # reject it before the structural validation runs.
      - name: Reject truncated model output
        if: needs.generate-release-notes.outputs.stop_reason == 'max_tokens'
        run: |
          echo "Model output was truncated (stopReason=max_tokens)."
          echo "Raise the BEDROCK_MAX_TOKENS variable and re-run."
          exit 1

      - name: Validate headings + bullets
        run: |
          set -euo pipefail
          test -s release-notes.md

          grep -q "^## Features" release-notes.md
          grep -q "^## Fixes" release-notes.md
          grep -q "^## Infrastructure" release-notes.md
          grep -q "^## Breaking Changes" release-notes.md

          # Each section must carry at least one bullet. The previous section is
          # checked when the next heading arrives, and the last one at END.
          awk '
            /^## /{ if (h != "" && c == 0) { print "No bullets under " h; exit 1 } h=$0; c=0; next }
            /^- /{ c++ }
            END{ if (h != "" && c == 0) { print "No bullets under " h; exit 1 } }
          ' release-notes.md

  # ---------------------------------------------------------------------------
  # 4. Draft only. A human reviews and publishes.
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish draft GitHub Release
    needs: [collect-metadata, validate-release-notes]
    if: needs.collect-metadata.outputs.pr_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release output artifact
        uses: actions/download-artifact@v4
        with:
          name: release-output

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          draft: true
          tag_name: v0.1.${{ github.run_number }}
